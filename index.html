<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Rewards</title>

<style>
body{
    margin:0;
    background:#121212;
    font-family:Arial,sans-serif;
    color:white;
}

.header{
    background:#00c853;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:400px;
    margin:40px auto;
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#00c853;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#00a844;
}
</style>

</head>

<body>

<div class="header">
Bonus Rewards
</div>

<div class="container">

<h2>Create Account</h2>

<input type="text" placeholder="Username">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<input type="number" placeholder="Deposit Amount">

<button>Create Account</button>

</div>

</body>
</html>
